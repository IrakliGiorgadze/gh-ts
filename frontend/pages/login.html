<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - IT Ticketing</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="container">
      <div
        id="login-card"
        class="card"
        style="max-width: 420px; margin: 60px auto; padding: 24px; display: none;"
      >
        <h2 style="margin-bottom: 4px">Sign in</h2>
        <p class="muted" style="margin-bottom: 16px">
          Use your AD credentials to continue.
        </p>

        <form
          id="login-form"
          class="grid"
          onsubmit="return false;"
          style="gap: 12px"
        >
          <input class="input" id="email" placeholder="Email" value="" />
          <input
            class="input"
            id="password"
            type="password"
            placeholder="Password"
            value=""
          />
          <button class="btn" id="btn-login">Login</button>
        </form>

        <div
          id="login-error"
          class="badge"
          style="margin-top: 10px; display: none"
        >
          Invalid credentials
        </div>

        <!-- Register link section -->
        <div style="text-align: center; margin-top: 16px">
          <span class="muted">Don't have an account?</span>
          <a href="./register.html" class="btn ghost" style="margin-left: 6px">
            Register
          </a>
        </div>
      </div>
    </div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
      // Check authentication immediately - redirect if already logged in
      // Wait for Auth to be available (api.js loads asynchronously)
      (async function checkAuthAndShowForm() {
        const loginCard = document.getElementById("login-card");
        
        // Wait for Auth to be available (with timeout - max 2.5 seconds)
        let attempts = 0;
        while (typeof window.Auth === 'undefined' && attempts < 50) {
          await new Promise(resolve => setTimeout(resolve, 50));
          attempts++;
        }
        
        // If Auth is still not available, show form (might be network issue)
        if (typeof window.Auth === 'undefined') {
          console.warn("[Login] Auth API not available after waiting, showing login form");
          if (loginCard) {
            loginCard.style.display = "block";
          }
          return;
        }
        
        try {
          const me = await window.Auth.me();
          if (me && me.email) {
            // User is already authenticated, redirect to home or next parameter
            console.log("[Login] User already authenticated, redirecting to:", me.email);
            const params = new URLSearchParams(window.location.search);
            const next = params.get("next");
            const target = next || "/index.html";
            console.log("[Login] Redirecting to:", target);
            window.location.replace(target);
            return; // Stop execution - page will redirect
          } else {
            console.log("[Login] User not authenticated (me:", me, ")");
          }
        } catch (e) {
          // Not authenticated or error - continue to show login form
          console.log("[Login] Auth check error, showing login form:", e);
        }
        
        // User is not authenticated - show the login form
        if (loginCard) {
          loginCard.style.display = "block";
        }
      })();

      (function () {
        const form = document.getElementById("login-form");
        const btn = document.getElementById("btn-login");
        const err = document.getElementById("login-error");
        const emailEl = document.getElementById("email");
        const passEl = document.getElementById("password");

        // Helper to show/hide error badge
        function showError(msg) {
          err.textContent = msg || "Invalid credentials";
          err.style.display = "inline-block";
        }
        function hideError() {
          err.style.display = "none";
        }

        async function doLogin(e) {
          if (e) e.preventDefault();
          hideError();
          btn.disabled = true;

          const email = emailEl.value.trim();
          const password = passEl.value;

          if (!email || !password) {
            showError("Email and password are required");
            btn.disabled = false;
            return;
          }

          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include", // keep cookies
              body: JSON.stringify({ email, password }),
            });

            let data = null;
            try {
              data = await res.json();
            } catch (_) {}

            if (res.ok) {
              console.log("[Login] Login successful, user:", data);
              // Set flag to indicate we just logged in (for index.html to wait for cookie)
              sessionStorage.setItem("just_logged_in", "true");
              // Cookie is set by the server, just redirect
              // No need to verify - the cookie will be available on the next page
              const params = new URLSearchParams(window.location.search);
              const next = params.get("next");
              const target = next || "/index.html";
              console.log("[Login] Redirecting to:", target);
              // Small delay to ensure cookie is set
              setTimeout(() => {
                window.location.replace(target);
              }, 100);
            } else {
              console.error("[Login] Login failed:", res.status, data);
              showError(
                (data && (data.error || data.message)) || "Invalid credentials"
              );
              btn.disabled = false;
            }
          } catch (ex) {
            showError("Network error. Please try again.");
            btn.disabled = false;
          }
        }

        btn.addEventListener("click", doLogin);
        form.addEventListener("submit", doLogin);
      })();
    </script>
  </body>
</html>
