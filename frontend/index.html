<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IT Ticketing System</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="container" id="main-content" style="display: none;">
      <div class="nav">
        <div class="brand">
          <img
            src="./assets/images/gh-logo.png"
            alt="logo"
            width="28"
            height="28"
          />
          <span data-i18n="nav.itTicketing">Incident Management System</span>
        </div>
        <div id="nav-actions"></div>
      </div>

      <div class="grid grid-3">
        <div class="card kpi">
          <div class="muted" data-i18n="kpi.open">Open Tickets</div>
          <div class="val" id="kpi-open">0</div>
        </div>
        <div class="card kpi">
          <div class="muted" data-i18n="kpi.slaRisk">SLA at Risk</div>
          <div class="val" id="kpi-risk">0</div>
        </div>
        <div class="card kpi">
          <div class="muted" data-i18n="kpi.resolved7d">Resolved (7d)</div>
          <div class="val" id="kpi-resolved">0</div>
        </div>
      </div>

      <!-- Admin Quick Access (shown only to admins) -->
      <div id="admin-quick-access" style="display: none; margin-top: 16px">
        <div class="card" style="background: rgba(91, 140, 255, 0.1); border: 1px solid rgba(91, 140, 255, 0.3)">
          <div class="row" style="align-items: center; justify-content: space-between">
            <div>
              <h3 style="margin: 0 0 4px 0">Admin Panel</h3>
              <p class="muted" style="margin: 0; font-size: 14px">Manage users and system settings</p>
            </div>
            <a href="./pages/admin/users.html" class="btn" style="margin-left: 16px">
              Manage Users
            </a>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: 16px">
        <div
          class="row"
          style="align-items: center; justify-content: space-between"
        >
          <h3 style="margin: 0" data-i18n="tickets.title">Tickets</h3>
          <div class="row" style="gap: 8px">
            <input
              id="q"
              class="input"
              data-i18n-attr="placeholder"
              data-i18n-placeholder="tickets.searchPlaceholder"
              style="min-width: 260px"
            />
            <select id="filter-status">
              <option value="">All Statuses</option>
              <option>New</option>
              <option>Open</option>
              <option>In Progress</option>
              <option>Pending</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
            <button
              class="btn"
              onclick="location.href='./pages/create-ticket.html'"
            >
              <span data-i18n="tickets.newBtn">+ New Ticket</span>
            </button>
          </div>
        </div>

        <table class="table" style="margin-top: 12px">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Assignee</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
      </div>

      <footer>Geo Hospitals internal IT service management system</footer>
    </div>

    <script src="./assets/js/utils.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="./assets/js/api.js"></script>
    <script>
      // Auth check - redirect to login if not authenticated
      // This prevents unauthenticated users from seeing the dashboard
      // Content is hidden by default and only shown after authentication
      (async function() {
        // Ensure main content is hidden initially
        const mainContent = document.getElementById('main-content');
        if (mainContent) {
          mainContent.style.display = 'none';
        }
        
        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
          await new Promise(resolve => {
            document.addEventListener('DOMContentLoaded', resolve);
          });
        }
        
        // Check if we just logged in (from sessionStorage flag set by login page)
        const justLoggedIn = sessionStorage.getItem('just_logged_in') === 'true';
        
        if (justLoggedIn) {
          // Just logged in, wait longer for cookie to be available
          // Cookie needs time to be set by browser after redirect
          console.log("[Index] Just logged in, waiting for cookie...");
          await new Promise(resolve => setTimeout(resolve, 500));
          sessionStorage.removeItem('just_logged_in');
        }
        
        // Check authentication
        // On refresh, cookie should be available immediately
        // Only retry if we just logged in (cookie might not be set yet)
        let me = null;
        if (justLoggedIn) {
          // Just logged in - use retry logic
          // Wait for Auth to be available first
          let attempts = 0;
          while (typeof window.Auth === 'undefined' && attempts < 50) {
            await new Promise(resolve => setTimeout(resolve, 50));
            attempts++;
          }
          
          if (typeof window.Auth === 'undefined') {
            console.error("[Index] Auth API not available after waiting");
            const next = encodeURIComponent(location.pathname + location.search);
            location.replace('./pages/login.html?next=' + next);
            return;
          }
          
          let retries = 3;
          while (retries > 0) {
            try {
              me = await window.Auth.me();
              if (me && me.email) {
                break; // Success, exit retry loop
              }
            } catch (e) {
              console.log("[Index] Auth check attempt failed, retries left:", retries - 1, e);
            }
            
            retries--;
            if (retries > 0) {
              // Wait a bit before retrying
              await new Promise(resolve => setTimeout(resolve, 300));
            }
          }
        } else {
          // Normal page load/refresh - cookie should be available immediately
          // Wait for Auth to be available (api.js loads asynchronously)
          let attempts = 0;
          while (typeof window.Auth === 'undefined' && attempts < 50) {
            await new Promise(resolve => setTimeout(resolve, 50));
            attempts++;
          }
          
          if (typeof window.Auth === 'undefined') {
            console.error("[Index] Auth API not available after waiting");
            // Redirect to login if Auth is not available
            const next = encodeURIComponent(location.pathname + location.search);
            location.replace('./pages/login.html?next=' + next);
            return;
          }
          
          try {
            me = await window.Auth.me();
          } catch (e) {
            console.error("[Index] Auth check failed on refresh:", e);
            // On refresh, if auth fails, it means cookie is invalid or expired
            // Don't retry - just redirect to login
          }
        }
        
        if (!me || !me.email) {
          // Not authenticated, redirect to login
          console.log("[Index] Not authenticated, redirecting to login");
          const next = encodeURIComponent(location.pathname + location.search);
          location.replace('./pages/login.html?next=' + next);
          return; // Stop execution - page will redirect
        }
        
        console.log("[Index] Authenticated as:", me.email);
        
        // User is authenticated - show the content
        if (mainContent) {
          mainContent.style.display = 'block';
        }
        
        // Only load dashboard components if authenticated
        // Load components after auth check passes
        const script = document.createElement('script');
        script.src = '/assets/js/components.js';
        document.body.appendChild(script);
        
        const dashboardScript = document.createElement('script');
        dashboardScript.src = './assets/js/dashboard.js';
        document.body.appendChild(dashboardScript);
      })();
    </script>
  </body>
</html>
