version: "3.9"

services:
  db:
    image: postgres:15
    container_name: ticketing-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing_db}
      POSTGRES_USER: ${POSTGRES_USER:-ticketuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # optional: run any .sql in ./database/init on first boot
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketuser} -d ${POSTGRES_DB:-ticketing_db} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: ticketing-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      API_PORT: ${API_PORT:-8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_DSN: postgres://${POSTGRES_USER:-ticketuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ticketing_db}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8080:8080"
    # mount uploads if you need local persistence for attachments
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build:
      context: ./frontend
    container_name: ticketing-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    # if your frontend needs the API base URL at runtime, serve relative paths
    # and call /api/... directly from the browser

volumes:
  db-data: